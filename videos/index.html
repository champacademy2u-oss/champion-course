<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Champion Course Videos</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --brand: #6547e8;
      --line: #e6e8f0;
      --paper: #fbfbff;
      --success: #1fa86a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 8% 0, #e5ddff 0, transparent 30rem), radial-gradient(circle at 95% 8%, #fff0d0 0, transparent 24rem), var(--paper);
      color: var(--ink);
      font: 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 60px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(23, 32, 51, .1);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      text-decoration: none;
      font-size: 21px;
      font-weight: 850;
    }
    header p {
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      text-align: right;
    }
    .card {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.96);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 50px rgba(29,25,70,.09);
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    h1 {
      margin: 14px 0 10px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.02;
      letter-spacing: -.04em;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -.03em;
    }
    .intro {
      max-width: 760px;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }
    .video-card {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }
    .video-frame {
      overflow: hidden;
      background: #0a0d18;
      border: 6px solid #171c30;
      border-radius: 18px;
      box-shadow: 0 26px 60px rgba(10,13,28,.25);
    }
    video {
      display: block;
      width: 100%;
      max-height: 72vh;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
    }
    .meta span {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }
    .notice {
      margin-top: 20px;
      color: var(--muted);
      line-height: 1.7;
    }
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--brand), #8456f3);
      color: #fff;
      padding: 12px 17px;
      text-decoration: none;
      font-weight: 760;
      box-shadow: 0 8px 16px rgba(101,71,232,.2);
    }
    @media (max-width: 720px) {
      header { display: block; }
      header p { margin-top: 9px; text-align: left; }
      .card { padding: 18px; }
      .video-frame { border-width: 4px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="../">▣ Champ Academy</a>
      <p>Champion Course 视频回放区</p>
    </header>

    <section class="card">
      <span class="eyebrow">Videos · Course Replay</span>
      <h1>课程视频回放</h1>
      <p class="intro">这里放 Champion Course 的视频回放。当前页面是 GitHub Pages 静态版本，适合公开分享和快速观看。</p>

      <article class="video-card">
        <div>
          <h2>test</h2>
          <div class="meta">
            <span>文件大小：42 MB</span>
            <span>上传日期：2026-08-02</span>
            <span>格式：MP4</span>
          </div>
        </div>
        <div class="video-frame">
          <video controls controlsList="nodownload" preload="metadata" src="./champion-replay-test.mp4"></video>
        </div>
      </article>

      <p class="notice">提醒：GitHub Pages 是静态网站，不能提供真正的密码保护、观看期限和后台观看记录。如果要锁密码、记录谁看了多久，还是需要使用本机/云端 Node 视频后台。</p>
      <a class="back" href="../">返回 Champion Course</a>
    </section>
  </main>
</body>
</html>
